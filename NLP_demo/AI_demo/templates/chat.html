<!DOCTYPE html>
<html>
<head>
<title>Medical AI Assistant</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
display:flex;
flex-direction:column;
}

.header{
text-align:center;
font-size:28px;
padding:25px;
font-weight:bold;
}

.chat-area{
flex:1;
width:70%;
margin:auto;
display:flex;
flex-direction:column;
overflow-y:auto;
padding:20px;
}

.user{
align-self:flex-end;
background:#1e293b;
padding:12px 16px;
border-radius:10px;
margin:8px 0;
max-width:60%;
}

.ai{
align-self:flex-start;
background:linear-gradient(135deg,#4f46e5,#06b6d4);
padding:12px 16px;
border-radius:10px;
margin:8px 0;
max-width:60%;
}

.input-area{
width:70%;
margin:auto;
display:flex;
gap:10px;
padding:20px;
}

input{
flex:1;
padding:14px;
border:none;
border-radius:8px;
background:#1e293b;
color:white;
}

button{
padding:14px 20px;
border:none;
border-radius:8px;
background:#6366f1;
color:white;
cursor:pointer;
}
</style>

</head>

<body>

<div class="header">
🤖 Medical AI Assistant
</div>

<div class="chat-area">

{% for chat in chat_history %}

<div class="user">
<strong>You:</strong> {{chat.question}}
</div>

<div class="ai">
<strong>AI:</strong><br><br>
{{chat.answer}}
</div>

{% endfor %}

</div>

<form method="post" class="input-area" autocomplete="off">
{% csrf_token %}
<input type="text" name="question" placeholder="Ask about the document or any medical question..." autocomplete="off">
<button type="submit">Ask</button>
</form>

</body>
</html>
