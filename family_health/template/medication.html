<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medication Reminders</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}" />
    <link rel="stylesheet" href="{% static 'css/medication.css' %}" />
  </head>

  <body data-page="medication">
    <div class="container">
      <!-- SIDEBAR (same as other pages) -->
      <aside class="sidebar">
        <button id="sidebarToggle" class="sidebar-toggle">☰</button>

        <div class="sidebar-header">
          <div class="logo">
            <img src="{% static 'image/image.png' %}" class="image-h" />
            <span>FamilyHealth</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="{% url 'index' %}" data-page="dashboard">
            <i>🏠</i><span>Dashboard</span>
          </a>

          <a href="{% url 'add_members' %}" data-page="family">
            <i>👨‍👩‍👧</i><span>Family Members</span>
          </a>

          <a href="{% url 'health_report' %}" data-page="records">
            <i>📄</i><span>Health Records</span>
          </a>

          <a href="{% url 'medication' %}" data-page="medication">
            <i>⏰</i><span>Medication Reminders</span>
          </a>

          <a href="{% url 'emergency' %}" data-page="prescriptions">
            <i>💊</i><span>Emergency</span>
          </a>

          <a href="{% url 'ai_assistance' %}" data-page="chat">
            <i>💬</i><span>Health Chat</span>
          </a>
        </nav>
      </aside>

      <!-- MAIN -->
      <main class="main-content">
        <header class="navbar">
          <h1>Medication Reminders</h1>
          <p>Add medicines and reminder times</p>
        </header>

        <section class="medication-layout">
          <!-- ADD MEDICATION -->
          <div class="card">
            <h2>Add Medicine</h2>

            <form id="medForm">
              <input name="name" placeholder="Medicine Name" required />
              <input name="time" type="time" required />
              <button class="primary-btn">Add Reminder</button>
            </form>
          </div>

          <!-- LIST -->
          <div class="card">
            <h2>Active Reminders</h2>
            <ul id="medList" class="med-list"></ul>
            <p id="emptyMed" class="empty-state">No reminders added yet.</p>
          </div>
        </section>

        <footer class="footer">© 2025 Family Health Management System</footer>
      </main>
    </div>

    <script type="module" src="{% static 'js/medication.js' %}"></script>
    <script src="{% static 'js/sidebar.js' %}"></script>
  </body>
</html>
